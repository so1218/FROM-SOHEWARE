name: DebugBuild
on:
  push:
    branches:
      - master

env:
  SOLUTION_FILE_PATH: project/FromSoheEngine.slnx
  CONFIGURATION: Debug

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. NuGet CLI の準備
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      # 2. MSBuild を PATH に追加
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      # 3. ビルド前に NuGet パッケージ を復元
      - name: Restore NuGet Packages
        run: nuget restore ${{env.SOLUTION_FILE_PATH}}

      # 4. ビルドの実行
      - name: Build
        run: |
          msbuild ${{env.SOLUTION_FILE_PATH}} /p:Platform=x64 /p:Configuration=${{env.CONFIGURATION}} /p:PlatformToolset=v143
        
